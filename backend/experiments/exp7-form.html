<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Travel Destination Explorer Form</title>
  </head>
  <body>
    <h1>Travel Destination Explorer</h1>
    <form action="http://localhost:5000/api/form" method="post">
      <label>
        Name
        <input type="text" name="name" required>
      </label>
      <br>
      <label>
        Email
        <input type="email" name="email" required>
      </label>
      <br>
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
